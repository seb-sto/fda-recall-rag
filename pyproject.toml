[project]
name = "fda-recall-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.121.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langchain>=1.3.14",
    "langchain-text-splitters>=1.1.2",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.0",
    "slowapi>=0.1.10",
    "streamlit>=1.64.0",
    "structlog>=26.1.0",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.mypy]
explicit_package_bases = true
[[tool.mypy.overrides]]
module = ["chromadb.*", "slowapi.*"]
ignore_missing_imports = true
follow_imports = "skip"